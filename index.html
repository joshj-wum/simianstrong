const store = {
  get(key) {
    try {
      const v = localStorage.getItem(key);
      return v === null ? null : JSON.parse(v);
    } catch (e) {
      return null;
    }
  },
  set(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) {}
  },
  remove(key) {
    try {
      localStorage.removeItem(key);
    } catch (e) {}
  }
};

function configLabel(cfg) {

  const parts = [];
  if (cfg.grip) parts.push(cfg.grip);
  if (cfg.gripWidth && cfg.gripWidth !== "Shoulder Width") parts.push(cfg.gripWidth);
  if (cfg.attachment) parts.push(cfg.attachment);
  if (cfg.pos) parts.push(cfg.pos);
  if (cfg.barPos) parts.push(cfg.barPos === "Behind Neck" ? "Behind Neck" : cfg.barPos);
  if (cfg.loadPos) parts.push(cfg.loadPos);
  if (cfg.emphasis) parts.push(cfg.emphasis);
  return parts.join(" · ");
